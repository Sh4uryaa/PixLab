<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon_io/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">

    <title>PixLab</title>
</head>

<body>

    <nav>

        <a href="index.html" class="logo">
            <img id="website-logo" src="images/favicon_io/favicon-32x32.png" alt="Website Logo">
            PixLab
        </a>

        <div class="nav-links">
            <a href="gallery.html">Gallery</a>
            <a href="index.html">Filters</a>
            <a href="enhance.html">Enhance Image</a>
            <a href="about.html">About</a>
            <a href="#" id="login-button" class="login-link">
                Login
                <img src="images/user.png" alt="User" class="user-icon">
            </a>        
        </div>

    </nav>


    <main>

        <h1>Upload your image</h1>


        <div class="filter-workspace">



            <div class="filter-controls">

                <label for="fileInput" class="upload-box">

                    <span class="upload-button">
                        ⬆ Browse files
                    </span>

                    <p>Drop or add an image</p>

                    <p class="supported-formats">
                        Supported formats: PNG, JPG, JPEG, BMP, WebP
                    </p>

                </label>

                <input type="file"
                    id="fileInput"
                    accept="image/*">


                <div class="filter-selection">

                    <label for="filterOptions">
                        Choose filter:
                    </label>

                    <select id="filterOptions">

                        <option value="grayscale">
                            Grayscale
                        </option>

                        <option value="sepia">
                            Sepia
                        </option>

                        <option value="blur">
                            Blur
                        </option>

                        <option value="reflection">
                            Reflection
                        </option>

                    </select>

                </div>

                <button id="applyFilterBtn">Apply Filter</button>
            </div>



            <div class="comparison-container">

                <img id="filterExampleImg"
                    src="images/exampleImage.png"
                    alt="Original example image">

                <img id="filterExampleResultImg"
                    src="images/exampleImageGrayScale.png"
                    alt="Filtered example image">


                <div class="slider-line">

                    <div class="slider-button">

                        <img src="images/left-right.png"
                            alt="Left and right arrow">

                    </div>

                </div>


                <input type="range"
                    id="comparisonSlider"
                    min="0"
                    max="100"
                    value="50"
                    aria-label="Compare original and filtered image">

            </div>


        </div>


        <a id="downloadBtn" download>
            Download ⤓
        </a>

    </main>


<div id="login-modal" class="modal">
    <div class="modal-content">

        <button id="close-login" class="close-modal">&times;</button>

    <div class="login-heading">
        <img src="images/favicon_io/favicon-32x32.png" alt="PixLab logo">
        <h2 id="login-title">Sign in to PixLab</h2>
    </div>
        <form id="login-form">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" required>
            <p id="login-error"></p>
            <button type="submit" id="login-submit">Login</button>
        </form>

        <p class="forgot-password">Forgot password?</p>

        <div class="login-divider">
            <span>OR</span>
        </div>

        <button id="google-login" class="gsi-material-button">
            <div class="gsi-material-button-state"></div>

            <div class="gsi-material-button-content-wrapper">
                <div class="gsi-material-button-icon">
                    <svg version="1.1"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 48 48"
                        xmlns:xlink="http://www.w3.org/1999/xlink"
                        style="display: block;">

                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>

                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>

                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>

                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>

                        <path fill="none" d="M0 0h48v48H0z"></path>
                    </svg>
                </div>

                <span class="gsi-material-button-contents">
                    Continue with Google
                </span>

                <span style="display: none;">Continue with Google</span>
            </div>
        </button>

        <p class="signup-text" id="signup-title">
            <span id="signup-question">Don't have an account?</span>
            <span id="signup-link">Sign up</span>

            <span id="login-question">Already have an account?</span>
            <span id="login-link">Log in</span>
        </p>

    </div>
</div>

<footer>
    <div class="footer-content">
        <a href="index.html" class="logo">
            <img id="website-logo" src="images/favicon_io/favicon-32x32.png" alt="Website Logo">
            PixLab
        </a>

        <div class="footer-links">
            <a href="gallery.html">Gallery</a>
            <a href="index.html">Filters</a>
            <a href="enhance.html">Enhance Image</a>
            <a href="about.html">About</a>
        </div>
    </div>

    <div class="footer-bottom">
        <p>© 2026 PixLab. Licensed under the MIT License.</p>
    </div>
</footer>
<script type="module" src="auth.js"></script>
</body>

</html>
