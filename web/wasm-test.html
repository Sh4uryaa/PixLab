
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixLab WASM Test</title>
</head>
<body>
  <h2>PixLab C++ Engine Test</h2>
  <input type="file" id="upload" accept="image/*">
  <select id="filter">
    <option value="grayscale">Grayscale</option>
    <option value="sepia">Sepia</option>
    <option value="reflect">Reflection</option>
    <option value="blur">Blur</option>
  </select>
  <button id="apply">Apply C++ Filter</button>
  <p id="status">Loading C++ engine...</p>
  <canvas id="canvas"></canvas>

  <script type="module">
    import createPixLabModule from "./pixlab_wasm.js";
    import { applyPixLabFilter } from "./pixlab-wasm-example.js";

    const status = document.getElementById("status");
    const upload = document.getElementById("upload");
    const filter = document.getElementById("filter");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let module;
    let imageData;

    try {
      module = await createPixLabModule();
      status.textContent = "C++ engine loaded. Upload an image.";
    } catch (error) {
      status.textContent = "Engine failed to load: " + error.message;
      console.error(error);
    }

    upload.addEventListener("change", () => {
      const file = upload.files[0];
      if (!file) return;

      const image = new Image();
      image.onload = () => {
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        ctx.drawImage(image, 0, 0);
        imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        status.textContent = "Image loaded. Choose a filter and apply it.";
        URL.revokeObjectURL(image.src);
      };
      image.onerror = () => {
        status.textContent = "Could not load that image.";
      };
      image.src = URL.createObjectURL(file);
    });

    document.getElementById("apply").addEventListener("click", () => {
      if (!module || !imageData) {
        status.textContent = "Load the engine and upload an image first.";
        return;
      }

      try {
        const result = new ImageData(
          new Uint8ClampedArray(imageData.data),
          imageData.width,
          imageData.height
        );
        applyPixLabFilter(module, result, filter.value);
        imageData = result;
        ctx.putImageData(result, 0, 0);
        status.textContent = "Success! Filter processed by the C++ WebAssembly engine.";
      } catch (error) {
        status.textContent = "Filter failed: " + error.message;
        console.error(error);
      }
    });
  </script>
</body>
</html>
